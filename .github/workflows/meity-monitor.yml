name: MeitY Press Release Monitor
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: meity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright --break-system-packages
          python3 -m playwright install --with-deps chromium

      - name: Fetch MeitY Press Release page (JS-rendered)
        run: |
          python3 - <<'EOF'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://www.meity.gov.in/documents/press-release?page=1", timeout=60000)
              page.wait_for_load_state("networkidle", timeout=30000)
              html = page.content()
              browser.close()

          with open("meity_press_release.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"MeitY Press Release (rendered): {len(html)} chars")
          EOF

      # ---- TEMPORARY: remove this step once extraction regex is confirmed ----
      - name: DEBUG - inspect rendered MeitY structure
        run: |
          echo "--- Any press-release links? ---"
          grep -o 'href="[^"]*press-release[^"]*"' meity_press_release.html | sort -u | head -20
          echo "--- File size ---"
          wc -c meity_press_release.html

