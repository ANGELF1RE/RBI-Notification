name: RBI/SEBI/CERT-In Monitor - Notifications & Guidelines
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RBI and CERT-In pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -s -L -H "User-Agent: $UA" -o notifications.html \
            "https://www.rbi.org.in/scripts/NotificationUser.aspx"
          echo "RBI Notifications: $(wc -c < notifications.html) bytes"

          curl -s -L -H "User-Agent: $UA" -o master_directions.html \
            "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
          echo "RBI Master Directions: $(wc -c < master_directions.html) bytes"

          curl -s -L -H "User-Agent: $UA" -o certin_guidelines.html \
            "https://www.cert-in.org.in/s2cMainServlet?pageid=GUIDLNVIEW01"
          echo "CERT-In Guidelines: $(wc -c < certin_guidelines.html) bytes"

      - name: Fetch SEBI Media & Notifications pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -s -L -H "User-Agent: $UA" -o sebi_pr.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=23&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_public_notice.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=25&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_news_clarification.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=27&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_speeches.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=28&smid=0"
          for f in sebi_pr.html sebi_public_notice.html sebi_news_clarification.html sebi_speeches.html; do
            echo "$f: $(wc -c < $f) bytes"
          done

      # ---------------- RBI Notifications ----------------
      - name: Check RBI Notifications for new entries
        id: check_notif
        run: |
          MAX_ID=$(grep -oP '(?<=NotificationUser\.aspx\?Id=)\d+' notifications.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_notif_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          if [ -n "$MAX_ID" ] && [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new RBI Notifications
        if: steps.check_notif.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json
          with open('notifications.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          prev_id = int("${{ steps.check_notif.outputs.prev_id }}")
          pattern = r'NotificationUser\.aspx\?Id=(\d+)&(?:amp;)?Mode=0[^>]*>([^<]+)</a>'
          matches = re.findall(pattern, content)
          print(f"Total notification matches: {len(matches)}")
          new_items, seen = [], set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/scripts/NotificationUser.aspx?Id={id_str}&Mode=0'
                  })
          new_items.sort(key=lambda x: int(x['id']), reverse=True)
          with open('new_notifications.json', 'w') as f:
              json.dump(new_items, f, indent=2)
          print(f"New notifications found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      # ---------------- RBI Master Directions ----------------
      - name: Check RBI Master Directions for new entries
        id: check_md
        run: |
          MAX_ID=$(grep -oP '(?<=id=)\d+' master_directions.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_md_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          if [ -n "$MAX_ID" ] && [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new RBI Master Directions
        if: steps.check_md.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json, base64
          with open('master_directions.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          prev_id = int("${{ steps.check_md.outputs.prev_id }}")
          viewstate_match = re.search(r'__VIEWSTATE[^>]*value="([^"]+)"', content)
          decoded_text = ""
          if viewstate_match:
              try:
                  decoded_text = base64.b64decode(viewstate_match.group(1)).decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"Decode error: {e}")
          pattern = r'href=BS_ViewMasDirections\.aspx\?id=(\d+)>\s*([^<]+)'
          matches = re.findall(pattern, decoded_text)
          print(f"Total master direction matches: {len(matches)}")
          new_items, seen = [], set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id={id_str}'
                  })
          new_items.sort(key=lambda x: int(x['id']), reverse=True)
          with open('new_master_directions.json', 'w') as f:
              json.dump(new_items, f, indent=2)
          print(f"New master directions found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      # ---------------- SEBI (all 4 sources, consolidated) ----------------
      - name: Check and extract all SEBI sources
        id: check_sebi
        run: |
          python3 - <<'EOF'
          import re, json, os

          SOURCES = [
              {"file": "sebi_pr.html",               "state": ".github/sebi_pr_last_id.txt",               "tag": "SEBI PRESS RELEASE",     "out": "new_sebi_pr.json"},
              {"file": "sebi_public_notice.html",     "state": ".github/sebi_public_notice_last_id.txt",     "tag": "SEBI PUBLIC NOTICE",      "out": "new_sebi_public_notice.json"},
              {"file": "sebi_news_clarification.html","state": ".github/sebi_news_clarification_last_id.txt","tag": "SEBI NEWS CLARIFICATION", "out": "new_sebi_news_clarification.json"},
              {"file": "sebi_speeches.html",          "state": ".github/sebi_speeches_last_id.txt",          "tag": "SEBI SPEECH",             "out": "new_sebi_speeches.json"},
          ]

          pattern = r'href="(https://www\.sebi\.gov\.in/media[^"]*_(\d+)\.html)"[^>]*>([^<]+)</a>'

          any_new = False

          for src in SOURCES:
              with open(src["file"], 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              prev_id = 0
              if os.path.exists(src["state"]):
                  with open(src["state"]) as f:
                      prev_id = int(f.read().strip() or 0)

              matches = re.findall(pattern, content)
              max_id = prev_id
              new_items, seen = [], set()
              for url, id_str, title in matches:
                  id_int = int(id_str)
                  max_id = max(max_id, id_int)
                  title = title.strip()
                  if id_int > prev_id and id_str not in seen and len(title) > 10:
                      seen.add(id_str)
                      new_items.append({'id': id_str, 'title': title, 'url': url, 'tag': src["tag"]})

              new_items.sort(key=lambda x: int(x['id']), reverse=True)
              with open(src["out"], 'w') as f:
                  json.dump(new_items, f, indent=2)

              print(f"{src['file']}: {len(matches)} total matches, {len(new_items)} new, max_id={max_id}, prev_id={prev_id}")

              if new_items:
                  any_new = True

              os.makedirs(os.path.dirname(src["state"]), exist_ok=True)
              with open(src["state"], 'w') as f:
                  f.write(str(max_id))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new_found={'true' if any_new else 'false'}\n")
          EOF

      # ---------------- CERT-In Guidelines ----------------
      - name: Check CERT-In Guidelines for new entries
        id: check_certin
        run: |
          MAX_KEY=$(grep -oP 'CISG-\d{4}-\d+' certin_guidelines.html | sort -u | awk -F'-' '{printf "%d%02d\n",$2,$3}' | sort -n | tail -1)
          PREV_KEY=$(cat .github/certin_guidelines_last_key.txt 2>/dev/null || echo "0")
          echo "max_key=$MAX_KEY" >> $GITHUB_OUTPUT
          echo "prev_key=$PREV_KEY" >> $GITHUB_OUTPUT
          if [ -n "$MAX_KEY" ] && [ "$MAX_KEY" -gt "$PREV_KEY" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new CERT-In Guidelines
        if: steps.check_certin.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json
          with open('certin_guidelines.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()
          prev_key = int("${{ steps.check_certin.outputs.prev_key }}")
          pattern = r"href='s2cMainServlet\?pageid=GUIDLNVIEW02&refcode=(CISG-(\d{4})-(\d+))'>\s*<b>([^<]+)</b>"
          matches = re.findall(pattern, content)
          print(f"Total CERT-In matches: {len(matches)}")
          new_items, seen = [], set()
          for refcode, yr, seq, title in matches:
              key = int(yr) * 100 + int(seq)
              if key > prev_key and refcode not in seen:
                  seen.add(refcode)
                  new_items.append({
                      'id': refcode,
                      'key': key,
                      'title': title.strip(),
                      'url': f'https://www.cert-in.org.in/s2cMainServlet?pageid=GUIDLNVIEW02&refcode={refcode}'
                  })
          new_items.sort(key=lambda x: x['key'], reverse=True)
          with open('new_certin_guidelines.json', 'w') as f:
              json.dump(new_items, f, indent=2)
          print(f"New CERT-In guidelines found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      # ---------------- Email ----------------
      - name: Send email alert
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true' || steps.check_sebi.outputs.new_found == 'true' || steps.check_certin.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import json, smtplib, textwrap
          from datetime import date
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except FileNotFoundError:
                  return []

          notif_items    = load('new_notifications.json')
          md_items       = load('new_master_directions.json')
          sebi_pr        = load('new_sebi_pr.json')
          sebi_notice    = load('new_sebi_public_notice.json')
          sebi_news      = load('new_sebi_news_clarification.json')
          sebi_speeches  = load('new_sebi_speeches.json')
          certin_items   = load('new_certin_guidelines.json')

          sebi_all = sebi_pr + sebi_notice + sebi_news + sebi_speeches
          total = len(notif_items) + len(md_items) + len(sebi_all) + len(certin_items)
          today = date.today().strftime('%d-%b-%Y')

          # ---- plain text fallback ----
          sections_plain = []
          if notif_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in notif_items]
              sections_plain.append(f"RBI NOTIFICATIONS ({len(notif_items)} new)\n" + "\n\n".join(lines))
          if md_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in md_items]
              sections_plain.append(f"RBI MASTER DIRECTIONS ({len(md_items)} new)\n" + "\n\n".join(lines))
          if sebi_all:
              lines = [f"- [{i['tag']}] {i['title']}\n  {i['url']}" for i in sebi_all]
              sections_plain.append(f"SEBI UPDATES ({len(sebi_all)} new)\n" + "\n\n".join(lines))
          if certin_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in certin_items]
              sections_plain.append(f"CERT-IN GUIDELINES ({len(certin_items)} new)\n" + "\n\n".join(lines))

          plain_body = textwrap.dedent(f"""\
          Hi Team, Please find the recent regulatory update

          {total} new item(s) published across RBI, SEBI, and CERT-In.

          {chr(10).join(sections_plain)}

          ------------------------------
          GET IN TOUCH
          ------------------------------
          Aumyaa Consulting Services LLP | Head Quarter: Noida
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh - 201301
          Services: PAN India

          Yukti Arora: yukti.arora@aumyaa.com
          Ayushi Aggarwal: ayushi.aggarwal@aumyaa.com
          www.aumyaa.com

          Follow us on LinkedIn (https://www.linkedin.com/company/aumyaa) & YouTube (https://www.youtube.com/@aumyaalearningacademy5425) for updates on NBFC regulatory compliance.

          Warm regards,
          Team Aumyaa
          """)

          def card(item, tag):
              return textwrap.dedent(f"""\
              <div style="padding:14px 18px;border-left:3px solid #f7c600;background:#fafafa;margin-bottom:10px;border-radius:0 6px 6px 0;">
              <span style="display:inline-block;background:#111111;color:#f7c600;font-size:11px;font-weight:bold;letter-spacing:.5px;padding:2px 8px;border-radius:10px;margin-bottom:6px;">{tag}</span>
              <div style="margin-top:6px;"><a href="{item['url']}" style="color:#111111;font-size:14px;font-weight:600;text-decoration:none;line-height:1.4;">{item['title']}</a></div>
              </div>""")

          cards = ""
          if notif_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">RBI Notifications</p>'
              cards += "".join(card(i, "RBI NOTIFICATION") for i in notif_items)
          if md_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">RBI Master Directions</p>'
              cards += "".join(card(i, "RBI MASTER DIRECTION") for i in md_items)
          if sebi_all:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">SEBI Updates</p>'
              cards += "".join(card(i, i['tag']) for i in sebi_all)
          if certin_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">CERT-In Guidelines</p>'
              cards += "".join(card(i, "CERT-IN GUIDELINE") for i in certin_items)

          html_body = textwrap.dedent(f"""\
          <html><body style="margin:0;padding:0;background:#eeeeee;font-family:Arial,Helvetica,sans-serif;">
          <div style="max-width:640px;margin:20px auto;background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <div style="background:#111111;padding:28px 24px 22px 24px;text-align:center;">
          <h1 style="color:#ffffff;margin:0;font-size:20px;font-weight:700;letter-spacing:.5px;">AUMYAA</h1>
          <p style="color:#f7c600;margin:2px 0 14px 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;">Consulting Services LLP</p>
          <h2 style="color:#ffffff;margin:0;font-size:18px;font-weight:700;">Regulatory Updates</h2>
          <p style="color:#f7c600;margin:4px 0 0 0;font-size:12px;">{today}</p>
          </div>
          <div style="height:3px;background:#f7c600;"></div>
          <div style="padding:24px 24px 8px 24px;">
          <p style="color:#111111;font-size:15px;margin:0 0 2px 0;">Hi team,</p>
          <p style="color:#555555;font-size:14px;margin:0 0 4px 0;">Please find the recent regulatory update — <b style="color:#111111;">{total} new item(s)</b> published.</p>
          {cards}
          </div>
          <div style="background:#111111;padding:26px 24px;margin-top:10px;">
          <p style="color:#f7c600;text-align:center;letter-spacing:3px;font-size:10px;margin:0 0 18px 0;text-transform:uppercase;">— — — — — Get in touch — — — — —</p>
          <p style="color:#ffffff;font-size:13px;margin:0 0 3px 0;font-weight:bold;">Aumyaa Consulting Services LLP</p>
          <p style="color:#999999;font-size:11px;margin:0 0 14px 0;line-height:1.5;">
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh — 201301<br>
          Services: PAN India
          </p>
          <p style="color:#dddddd;font-size:12px;margin:0 0 4px 0;">Yukti Arora: &nbsp;·&nbsp; <a href="mailto:yukti.arora@aumyaa.com" style="color:#f7c600;text-decoration:none;">yukti.arora@aumyaa.com</a></p>
          <p style="color:#dddddd;font-size:12px;margin:0 0 14px 0;">Ayushi Aggarwal: &nbsp;·&nbsp; <a href="mailto:ayushi.aggarwal@aumyaa.com" style="color:#f7c600;text-decoration:none;">ayushi.aggarwal@aumyaa.com</a></p>
          <p style="margin:0 0 12px 0;"><a href="https://www.aumyaa.com" style="color:#f7c600;font-size:12px;text-decoration:none;">www.aumyaa.com</a></p>
          <p style="color:#777777;font-size:10px;margin:0 0 16px 0;">Follow us on <a href="https://www.linkedin.com/company/aumyaa" style="color:#f7c600;text-decoration:none;">LinkedIn</a> &amp; <a href="https://www.youtube.com/@aumyaalearningacademy5425" style="color:#f7c600;text-decoration:none;">YouTube</a> for updates on NBFC regulatory compliance.</p>
          <p style="color:#ffffff;font-size:12px;margin:0;">Warm regards,<br>Team Aumyaa</p>
          </div>
          </div>
          </body></html>""")

          gmail_user = "${{ secrets.GMAIL_USER }}"
          gmail_pass = "${{ secrets.GMAIL_APP_PASSWORD }}"
          to_email_list = [e.strip() for e in "${{ secrets.ALERT_EMAIL }}".split(",")]

          parts = []
          if notif_items:  parts.append(f"{len(notif_items)} RBI Notification(s)")
          if md_items:     parts.append(f"{len(md_items)} RBI Master Direction(s)")
          if sebi_all:     parts.append(f"{len(sebi_all)} SEBI Update(s)")
          if certin_items: parts.append(f"{len(certin_items)} CERT-In Guideline(s)")
          subject = "Regulatory Alert: " + " + ".join(parts) + " Published"

          msg = MIMEMultipart('alternative')
          msg['From']    = gmail_user
          msg['To']      = ", ".join(to_email_list)
          msg['Subject'] = subject
          msg.attach(MIMEText(plain_body, 'plain'))
          msg.attach(MIMEText(html_body, 'html'))

          print(f"HTML body size: {len(html_body.encode('utf-8'))} bytes")

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email_list, msg.as_string())
              print(f"Email sent to {len(to_email_list)} recipients: {subject}")
          EOF

      # ---------------- Save state ----------------
      - name: Save new IDs and push
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true' || steps.check_sebi.outputs.new_found == 'true' || steps.check_certin.outputs.new_found == 'true'
        run: |
          if [ "${{ steps.check_notif.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_notif.outputs.max_id }}" > .github/rbi_notif_last_id.txt
          fi
          if [ "${{ steps.check_md.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_md.outputs.max_id }}" > .github/rbi_md_last_id.txt
          fi
          if [ "${{ steps.check_certin.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_certin.outputs.max_key }}" > .github/certin_guidelines_last_key.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_notif_last_id.txt .github/rbi_md_last_id.txt .github/certin_guidelines_last_key.txt .github/sebi_*_last_id.txt
          git commit -m "chore: update regulatory monitor last-seen IDs" || echo "Nothing to commit"
          git pull --rebase origin main
          git push

      - name: Upload fetched pages for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages-${{ github.run_id }}
          path: |
            notifications.html
            master_directions.html
            certin_guidelines.html
            sebi_*.html
          retention-days: 7
