name: RBI Master Directions Monitor
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug - show link structure
        run: |
          python3 - <<'EOF'
          import re

          with open('rbi_page.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          # Find ALL links containing 'id=' and print raw HTML around them
          matches = re.finditer(r'.{0,50}id=1344[0-9].{0,100}', content)
          for i, m in enumerate(matches):
              print(f"--- Match {i+1} ---")
              print(m.group())
              print()
          EOF

      - name: Fetch RBI page
        run: |
          curl -v "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.5" \
            -L \
            -o rbi_page.html \
            -w "\nHTTP Status: %{http_code}\nSize: %{size_download} bytes\n"
          
          echo "File exists: $(ls -la rbi_page.html 2>/dev/null || echo 'NO FILE')"
          echo "First 500 chars:"
          head -c 500 rbi_page.html || echo "Cannot read file"

      - name: Check for new directions
        id: check
        run: |
          MAX_ID=$(grep -oP '(?<=id=)\d+' rbi_page.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Current max ID: $MAX_ID | Previous ID: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new direction titles
        if: steps.check.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json

          with open('rbi_page.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check.outputs.prev_id }}")

          # Match both href patterns RBI uses
          pattern = r'[Bb][Ss]_[Vv]iew[Mm]as[Dd]irections\.aspx\?id=(\d+)[^"]*"[^>]*>([^<]{10,})</a>'
          matches = re.findall(pattern, content)

          new_items = []
          seen = set()
          for id_str, title in matches:
              if int(id_str) > prev_id and id_str not in seen:
                  seen.add(id_str)
                  clean_title = title.strip()
                  if clean_title and 'PDF' not in clean_title:
                      new_items.append({
                          'id': id_str,
                          'title': clean_title,
                          'url': f'https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id={id_str}'
                      })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_directions.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"Found {len(new_items)} new directions")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Send email alert
        if: steps.check.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import json, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          with open('new_directions.json') as f:
              items = json.load(f)

          lines = []
          for item in items:
              lines.append(f"• {item['title']}\n  Link: {item['url']}")

          body = f"""New RBI Master Direction(s) have been published.Total new: {len(items)}{"=" * 60}{chr(10).join(lines)}{"=" * 60}Source: https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"""

          gmail_user = "${{ secrets.GMAIL_USER }}"
          gmail_pass = "${{ secrets.GMAIL_APP_PASSWORD }}"
          to_email   = "${{ secrets.ALERT_EMAIL }}"

          msg = MIMEMultipart()
          msg['From']    = gmail_user
          msg['To']      = to_email
          msg['Subject'] = f"RBI Alert: {len(items)} New Master Direction(s) Published"
          msg.attach(MIMEText(body, 'plain'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email, msg.as_string())
              print(f"Email sent successfully to {to_email}")
          EOF

      - name: Save new max ID
        if: steps.check.outputs.new_found == 'true'
        run: |
          echo "${{ steps.check.outputs.max_id }}" > .github/rbi_last_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_last_id.txt
          git commit -m "chore: update RBI last seen ID to ${{ steps.check.outputs.max_id }}"
          git push
