name: RBI Master Directions Monitor
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RBI page
        run: |
          set -e
          echo "Starting fetch..."
          
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.5" \
            -H "Connection: keep-alive" \
            --max-time 30 \
            -o rbi_page.html \
            -w "HTTP Status: %{http_code}\nDownload size: %{size_download} bytes\n" \
            "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
          
          echo "--- File check ---"
          ls -la rbi_page.html
          echo "--- First 1000 chars ---"
          head -c 1000 rbi_page.html


      - name: Debug VIEWSTATE decode
        run: |
          python3 - <<'EOF'
          import re, base64

          with open('rbi_page.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          viewstate_match = re.search(r'__VIEWSTATE[^>]*value="([^"]+)"', content)
          if viewstate_match:
              try:
                  decoded = base64.b64decode(viewstate_match.group(1)).decode('utf-8', errors='ignore')
                  # Find and print 200 chars around id=1344
                  for m in re.finditer(r'.{0,100}id=1344\d.{0,100}', decoded):
                      print("FOUND:", m.group())
                      print("---")
              except Exception as e:
                  print(f"Error: {e}")
          else:
              print("No VIEWSTATE found")
          EOF

      - name: Debug link structure
        run: |
          set -e
          echo "File size: $(wc -c < rbi_page.html) bytes"
          echo "--- All lines containing 'id=' ---"
          grep -i 'id=' rbi_page.html | head -20

      - name: Check for new directions
        id: check
        run: |
          set -e
          MAX_ID=$(grep -oP '(?<=id=)\d+' rbi_page.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Current max ID: $MAX_ID | Previous ID: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new direction titles
        if: steps.check.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json, base64

          with open('rbi_page.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check.outputs.prev_id }}")

          # The links are inside base64 encoded VIEWSTATE - decode it first
          viewstate_match = re.search(r'__VIEWSTATE[^>]*value="([^"]+)"', content)
          decoded_text = ""
          if viewstate_match:
              try:
                  decoded_text = base64.b64decode(viewstate_match.group(1)).decode('utf-8', errors='ignore')
                  print(f"Decoded VIEWSTATE length: {len(decoded_text)}")
              except Exception as e:
                  print(f"Decode error: {e}")

          # Search in both raw HTML and decoded viewstate
          search_text = content + decoded_text

          # Pattern 1: unquoted href (as seen in VIEWSTATE)
          matches1 = re.findall(r'href=BS_ViewMasDirections\.aspx\?id=(\d+)>([^<]+)<', search_text)
          # Pattern 2: quoted href
          matches2 = re.findall(r'href=["\']?[^"\']*BS_ViewMasDirections\.aspx\?id=(\d+)["\']?[^>]*>([^<]{10,})</a>', search_text)
          # Pattern 3: just grab all ids and titles near them
          matches3 = re.findall(r'id=(\d+)>([A-Z][^<]{20,})</a>', search_text)

          print(f"Pattern 1 matches: {len(matches1)}")
          print(f"Pattern 2 matches: {len(matches2)}")
          print(f"Pattern 3 matches: {len(matches3)}")

          # Show samples for debugging
          for m in (matches1 or matches2 or matches3)[:3]:
              print(f"Sample: {m}")

          all_matches = matches1 + matches2 + matches3

          new_items = []
          seen = set()
          for id_str, title in all_matches:
              title = title.strip()
              if (int(id_str) > prev_id and id_str not in seen
                      and len(title) > 15 and 'PDF' not in title
                      and title[0].isupper()):
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id={id_str}'
                  })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_directions.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"\nFound {len(new_items)} new directions")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Send email alert
        if: steps.check.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import json, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          with open('new_directions.json') as f:
              items = json.load(f)

          lines = []
          for item in items:
              lines.append(f"• {item['title']}\n  Link: {item['url']}")

          body = f"""New RBI Master Direction(s) have been published.

          Total new: {len(items)}

          {"=" * 60}

          {chr(10).join(lines)}

          {"=" * 60}

          Source: https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx
          """

          gmail_user = "${{ secrets.GMAIL_USER }}"
          gmail_pass = "${{ secrets.GMAIL_APP_PASSWORD }}"
          to_email   = "${{ secrets.ALERT_EMAIL }}"

          msg = MIMEMultipart()
          msg['From']    = gmail_user
          msg['To']      = to_email
          msg['Subject'] = f"RBI Alert: {len(items)} New Master Direction(s) Published"
          msg.attach(MIMEText(body, 'plain'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email, msg.as_string())
              print(f"Email sent successfully to {to_email}")
          EOF

      - name: Save new max ID
        if: steps.check.outputs.new_found == 'true'
        run: |
          echo "${{ steps.check.outputs.max_id }}" > .github/rbi_last_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_last_id.txt
          git commit -m "chore: update RBI last seen ID to ${{ steps.check.outputs.max_id }}"
          git push
