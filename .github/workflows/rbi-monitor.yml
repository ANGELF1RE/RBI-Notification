name: RBI Monitor - Notifications & Master Directions
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch both RBI pages
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o notifications.html \
            "https://www.rbi.org.in/scripts/NotificationUser.aspx"
          echo "Notifications page: $(wc -c < notifications.html) bytes"

          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o master_directions.html \
            "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
          echo "Master Directions page: $(wc -c < master_directions.html) bytes"

      - name: Check Notifications for new entries
        id: check_notif
        run: |
          MAX_ID=$(grep -oP '(?<=NotificationUser\.aspx\?Id=)\d+' notifications.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_notif_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Notifications - Current max: $MAX_ID | Previous: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Master Directions for new entries
        id: check_md
        run: |
          MAX_ID=$(grep -oP '(?<=id=)\d+' master_directions.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_md_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Master Directions - Current max: $MAX_ID | Previous: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new Notifications
        if: steps.check_notif.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json

          with open('notifications.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check_notif.outputs.prev_id }}")

          # Plain HTML pattern - links render directly in this page
          pattern = r'NotificationUser\.aspx\?Id=(\d+)&(?:amp;)?Mode=0[^>]*>([^<]+)</a>'
          matches = re.findall(pattern, content)
          print(f"Total notification matches: {len(matches)}")

          new_items = []
          seen = set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/scripts/NotificationUser.aspx?Id={id_str}&Mode=0'
                  })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_notifications.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"New notifications found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Extract new Master Directions
        if: steps.check_md.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json, base64

          with open('master_directions.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check_md.outputs.prev_id }}")

          viewstate_match = re.search(r'__VIEWSTATE[^>]*value="([^"]+)"', content)
          decoded_text = ""
          if viewstate_match:
              try:
                  decoded_text = base64.b64decode(viewstate_match.group(1)).decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"Decode error: {e}")

          pattern = r'href=BS_ViewMasDirections\.aspx\?id=(\d+)>\s*([^<]+)'
          matches = re.findall(pattern, decoded_text)
          print(f"Total master direction matches: {len(matches)}")

          new_items = []
          seen = set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id={id_str}'
                  })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_master_directions.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"New master directions found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Send email alert
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import json, smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          notif_items = []
          md_items = []

          try:
              with open('new_notifications.json') as f:
                  notif_items = json.load(f)
          except FileNotFoundError:
              pass

          try:
              with open('new_master_directions.json') as f:
                  md_items = json.load(f)
          except FileNotFoundError:
              pass

          sections = []

          if notif_items:
              lines = [f"• {i['title']}\n  {i['url']}" for i in notif_items]
              sections.append(f"NOTIFICATIONS ({len(notif_items)} new)\n{'='*60}\n" + "\n\n".join(lines))

          if md_items:
              lines = [f"• {i['title']}\n  {i['url']}" for i in md_items]
              sections.append(f"MASTER DIRECTIONS ({len(md_items)} new)\n{'='*60}\n" + "\n\n".join(lines))

          total = len(notif_items) + len(md_items)
          body = f"""RBI has published {total} new item(s).

          {chr(10).join(sections)}

          {'='*60}
          Notifications page: https://www.rbi.org.in/scripts/NotificationUser.aspx
          Master Directions page: https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx
          """

          gmail_user = "${{ secrets.GMAIL_USER }}"
          gmail_pass = "${{ secrets.GMAIL_APP_PASSWORD }}"
          to_email_list = [e.strip() for e in "${{ secrets.ALERT_EMAIL }}".split(",")]

          parts = []
          if notif_items: parts.append(f"{len(notif_items)} Notification(s)")
          if md_items:    parts.append(f"{len(md_items)} Master Direction(s)")
          subject = "RBI Alert: " + " + ".join(parts) + " Published"

          msg = MIMEMultipart()
          msg['From']    = gmail_user
          msg['To'] = ", ".join(to_email_list)
          msg['Subject'] = subject
          msg.attach(MIMEText(body, 'plain'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email_list, msg.as_string())
              print(f"Email sent to {len(to_email_list)} recipients: {subject}")
          EOF

      - name: Save new IDs and push
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true'
        run: |
          if [ "${{ steps.check_notif.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_notif.outputs.max_id }}" > .github/rbi_notif_last_id.txt
          fi
          if [ "${{ steps.check_md.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_md.outputs.max_id }}" > .github/rbi_md_last_id.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_notif_last_id.txt .github/rbi_md_last_id.txt
          git commit -m "chore: update RBI last seen IDs (notif=${{ steps.check_notif.outputs.max_id }}, md=${{ steps.check_md.outputs.max_id }})"
          git push
