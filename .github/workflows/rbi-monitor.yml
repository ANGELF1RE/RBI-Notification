name: RBI/SEBI/CERT-In Monitor - Notifications & Guidelines
on:
  schedule:
    - cron: '0 3,12,18 * * 1-5'
  workflow_dispatch:

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RBI and CERT-In pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -s -L -H "User-Agent: $UA" -o notifications.html \
            "https://www.rbi.org.in/scripts/NotificationUser.aspx"
          echo "RBI Notifications: $(wc -c < notifications.html) bytes"

          curl -s -L -H "User-Agent: $UA" -o notifications_rss.xml \
            "https://rbi.org.in/notifications_rss.xml"
          echo "RBI RSS: $(wc -c < notifications_rss.xml) bytes"

          curl -s -L -H "User-Agent: $UA" -o master_directions.html \
            "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
          echo "RBI Master Directions: $(wc -c < master_directions.html) bytes"

          curl -s -L -H "User-Agent: $UA" -o certin_guidelines.html \
            "https://www.cert-in.org.in/s2cMainServlet?pageid=GUIDLNVIEW01"
          echo "CERT-In Guidelines: $(wc -c < certin_guidelines.html) bytes"

      - name: Fetch SEBI Media & Notifications pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          curl -s -L -H "User-Agent: $UA" -o sebi_pr.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=23&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_public_notice.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=25&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_news_clarification.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=27&smid=0"
          curl -s -L -H "User-Agent: $UA" -o sebi_speeches.html \
            "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=6&ssid=28&smid=0"
          for f in sebi_pr.html sebi_public_notice.html sebi_news_clarification.html sebi_speeches.html; do
            echo "$f: $(wc -c < $f) bytes"
          done

      # ---------------- RBI Notifications ----------------
      - name: Install parser dependency
        run: python3 -m pip install -q beautifulsoup4

      - name: Extract RBI Notifications
        id: notif
        run: python3 .github/scripts/regulatory_monitor.py notif

      # ---------------- RBI Master Directions ----------------
      - name: Extract RBI Master Directions
        id: md
        run: python3 .github/scripts/regulatory_monitor.py md

      # ---------------- SEBI (all 4 sources, consolidated) ----------------
      - name: Extract SEBI updates
        id: sebi
        run: python3 .github/scripts/regulatory_monitor.py sebi

      # ---------------- CERT-In Guidelines ----------------
      - name: Extract CERT-In Guidelines
        id: certin
        run: python3 .github/scripts/regulatory_monitor.py certin

      # ---------------- Email ----------------
      - name: Send email alert
        if: steps.notif.outputs.new_found == 'true' || steps.md.outputs.new_found == 'true' || steps.sebi.outputs.new_found == 'true' || steps.certin.outputs.new_found == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python3 - <<'EOF'
          import json, smtplib, textwrap, os
          from datetime import date
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except FileNotFoundError:
                  return []

          notif_items    = load('new_notifications.json')
          md_items       = load('new_master_directions.json')
          sebi_pr        = load('new_sebi_pr.json')
          sebi_notice    = load('new_sebi_public_notice.json')
          sebi_news      = load('new_sebi_news_clarification.json')
          sebi_speeches  = load('new_sebi_speeches.json')
          certin_items   = load('new_certin_guidelines.json')

          sebi_all = sebi_pr + sebi_notice + sebi_news + sebi_speeches
          rbi_all  = notif_items + md_items
          total = len(rbi_all) + len(sebi_all) + len(certin_items)

          all_items = notif_items + md_items + sebi_all + certin_items
          dates = set(i['date'] for i in all_items if i.get('date'))
          label_date = (
              sorted(dates)[0] if len(dates) == 1
              else f"{sorted(dates)[0]} \u2013 {sorted(dates)[-1]}" if len(dates) >= 2
              else date.today().strftime('%d-%b-%Y')
          )

          # ---- plain text fallback ----
          sections_plain = []
          if notif_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in notif_items]
              sections_plain.append(f"RBI NOTIFICATIONS ({len(notif_items)} new)\n" + "\n\n".join(lines))
          if md_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in md_items]
              sections_plain.append(f"RBI MASTER DIRECTIONS ({len(md_items)} new)\n" + "\n\n".join(lines))
          if sebi_all:
              lines = [f"- [{i['tag']}] {i['title']}\n  {i['url']}" for i in sebi_all]
              sections_plain.append(f"SEBI UPDATES ({len(sebi_all)} new)\n" + "\n\n".join(lines))
          if certin_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in certin_items]
              sections_plain.append(f"CERT-IN GUIDELINES ({len(certin_items)} new)\n" + "\n\n".join(lines))

          plain_body = textwrap.dedent(f"""\
          Hi Team, Please find the recent regulatory update

          {total} new item(s) published across RBI, SEBI, and CERT-In.

          {chr(10).join(sections_plain)}

          ------------------------------
          GET IN TOUCH
          ------------------------------
          Aumyaa Consulting Services LLP | Head Quarter: Noida
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh - 201301
          Services: PAN India

          Yukti Arora: yukti.arora@aumyaa.com
          www.aumyaa.com
          Link of Aumyaa website - https://aumyaa.com/insights

          Follow us on LinkedIn (https://www.linkedin.com/company/aumyaa) & YouTube (https://www.youtube.com/@aumyaalearningacademy5425) for updates on NBFC regulatory compliance.

          Warm regards,
          Team Aumyaa
          """)

          # ---- category badges (icon + label + count), mirrors the reference banner's icon row ----
          def category_badge(emoji, label, count):
              if count == 0:
                  return ""
              return textwrap.dedent(f"""\
              <td align="center" valign="top" style="padding:0 16px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td align="center" valign="middle" bgcolor="#f7c600" style="background-color:#f7c600;width:54px;height:54px;border-radius:27px;font-size:22px;line-height:54px;">{emoji}</td>
              </tr></table>
              <div style="color:#111111;font-size:11px;font-weight:bold;letter-spacing:.3px;margin-top:8px;white-space:nowrap;">{label}</div>
              <div style="color:#8a6d00;font-size:11px;margin-top:1px;">{count} new</div>
              </td>""")

          badges = "".join([
              category_badge("\U0001F3E6", "RBI", len(rbi_all)),
              category_badge("\U0001F4CA", "SEBI", len(sebi_all)),
              category_badge("\U0001F6E1", "CERT-IN", len(certin_items)),
          ])

          # ---- item card, styled as a clickable row with an arrow, like the reference template's link blocks ----
          def card(item, tag):
              return textwrap.dedent(f"""\
              <a href="{item['url']}" style="text-decoration:none;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:10px;">
              <tr>
              <td width="4" bgcolor="#f7c600" style="background-color:#f7c600;font-size:1px;line-height:1px;">&nbsp;</td>
              <td class="aumyaa-card-bg" bgcolor="#fafafa" style="background-color:#fafafa;padding:14px 16px;">
              <span style="display:inline-block;background-color:#111111;color:#f7c600;font-size:10px;font-weight:bold;letter-spacing:.5px;padding:2px 8px;border-radius:2px;">{tag}</span>
              <div style="margin-top:7px;color:#111111;font-size:14px;font-weight:600;line-height:1.4;">{item['title']}</div>
              </td>
              <td width="34" align="center" valign="middle" bgcolor="#fafafa" style="background-color:#fafafa;color:#f7c600;font-size:18px;font-weight:bold;">&rsaquo;</td>
              </tr>
              </table>
              </a>""")

          cards = ""
          if notif_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px 0;">RBI Notifications</p>'
              cards += "".join(card(i, "RBI NOTIFICATION") for i in notif_items)
          if md_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px 0;">RBI Master Directions</p>'
              cards += "".join(card(i, "RBI MASTER DIRECTION") for i in md_items)
          if sebi_all:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px 0;">SEBI Updates</p>'
              cards += "".join(card(i, i['tag']) for i in sebi_all)
          if certin_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px 0;">CERT-In Guidelines</p>'
              cards += "".join(card(i, "CERT-IN GUIDELINE") for i in certin_items)

          # ---- primary CTA link (first item, falls back to insights page) ----
          cta_url = all_items[0]['url'] if all_items else "https://aumyaa.com/insights"

          # ---- social icon buttons ----
          def social_icon(url, glyph):
              return textwrap.dedent(f"""\
              <td style="padding:0 4px;">
              <a href="{url}" style="text-decoration:none;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td align="center" valign="middle" bgcolor="#f7c600" style="background-color:#f7c600;width:30px;height:30px;border-radius:15px;color:#111111;font-size:13px;font-weight:bold;line-height:30px;">{glyph}</td>
              </tr></table>
              </a>
              </td>""")

          social_icons = "".join([
              social_icon("https://www.linkedin.com/company/aumyaa", "in"),
              social_icon("https://www.youtube.com/@aumyaalearningacademy5425", "\u25B6"),
          ])

          html_body = textwrap.dedent(f"""\
          <!DOCTYPE html>
          <html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="color-scheme" content="light only">
          <meta name="supported-color-schemes" content="light only">
          <!--[if mso]>
          <style type="text/css">
          body, table, td {{ font-family: Arial, Helvetica, sans-serif !important; }}
          </style>
          <noscript>
          <xml>
          <o:OfficeDocumentSettings>
          <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
          </xml>
          </noscript>
          <![endif]-->
          <style type="text/css">
            body {{ margin:0; padding:0; background:#eeeeee; }}
            table {{ border-collapse:collapse; }}
            a {{ text-decoration:none; }}
            [data-ogsc] .aumyaa-dark-bg,
            [data-ogsb] .aumyaa-dark-bg {{ background-color:#111111 !important; }}
            [data-ogsc] .aumyaa-white-text,
            [data-ogsb] .aumyaa-white-text {{ color:#ffffff !important; }}
            [data-ogsc] .aumyaa-yellow-text,
            [data-ogsb] .aumyaa-yellow-text {{ color:#f7c600 !important; }}
            [data-ogsc] .aumyaa-card-bg,
            [data-ogsb] .aumyaa-card-bg {{ background-color:#fafafa !important; }}
            [data-ogsc] .aumyaa-body-text,
            [data-ogsb] .aumyaa-body-text {{ color:#111111 !important; }}
          </style>
          </head>
          <body style="margin:0;padding:0;background:#eeeeee;font-family:Arial,Helvetica,sans-serif;">

          <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{total} new regulatory update(s) from RBI, SEBI and CERT-In &nbsp;\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C\u200C</div>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eeeeee;">
          <tr><td align="center" style="padding:20px 12px;">
          <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="max-width:640px;width:100%;background:#ffffff;">

          <!-- HERO / MASTHEAD -->
          <tr><td class="aumyaa-dark-bg" bgcolor="#111111" style="background-color:#111111;background-image:linear-gradient(135deg,#111111 60%,#22242a 100%);padding:30px 24px 26px 24px;text-align:center;border-top:4px solid #f7c600;">
          <h1 class="aumyaa-white-text" style="color:#ffffff;margin:0;font-size:22px;font-weight:800;letter-spacing:1px;">AUMYAA</h1>
          <p class="aumyaa-yellow-text" style="color:#f7c600;margin:2px 0 18px 0;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;">Consulting Services LLP</p>
          <h2 class="aumyaa-white-text" style="color:#ffffff;margin:0;font-size:22px;font-weight:800;line-height:1.3;">REGULATORY UPDATES</h2>
          <p style="color:#bbbbbb;margin:6px 0 22px 0;font-size:13px;">{total} new item(s) &middot; {label_date}</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr>
          {badges}
          </tr></table>
          </td></tr>

          <tr><td bgcolor="#f7c600" style="background-color:#f7c600;height:3px;line-height:3px;font-size:1px;">&nbsp;</td></tr>

          <!-- CTA BANNER -->
          <tr><td style="padding:20px 24px 0 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#111111;">
          <tr>
          <td style="padding:16px 18px;">
          <p class="aumyaa-white-text" style="color:#ffffff;margin:0;font-size:13px;font-weight:bold;letter-spacing:.3px;">STAY INFORMED. VIEW. UNDERSTAND. COMPLY.</p>
          <p style="color:#999999;margin:4px 0 0 0;font-size:11px;">Access the detailed insights, key changes and effective dates below.</p>
          </td>
          <td align="right" style="padding:16px 18px;white-space:nowrap;">
          <a href="{cta_url}" style="display:inline-block;background-color:#f7c600;color:#111111;font-size:12px;font-weight:bold;padding:10px 16px;border-radius:2px;">VIEW UPDATES</a>
          </td>
          </tr>
          </table>
          </td></tr>

          <!-- ITEM LIST -->
          <tr><td style="padding:8px 24px 8px 24px;">
          <p class="aumyaa-body-text" style="color:#111111;font-size:15px;margin:16px 0 0 0;">Hi Team,</p>
          <p style="color:#555555;font-size:14px;margin:2px 0 4px 0;">Please find the recent regulatory update &mdash; <b class="aumyaa-body-text" style="color:#111111;">{total} new item(s)</b> published.</p>
          {cards}
          </td></tr>

          <!-- CONNECT BAR -->
          <tr><td style="padding:6px 24px 24px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#00a99d;">
          <tr>
          <td style="padding:14px 18px;color:#ffffff;font-size:13px;font-style:italic;">Connect with Our Experts</td>
          <td align="right" style="padding:14px 18px;">
          <a href="https://www.aumyaa.com" style="display:inline-block;background-color:#ffffff;color:#00a99d;font-size:11px;font-weight:bold;padding:6px 14px;border-radius:2px;">Click here</a>
          </td>
          </tr>
          </table>
          </td></tr>

          <!-- FOOTER -->
          <tr><td class="aumyaa-dark-bg" bgcolor="#111111" style="background-color:#111111;padding:26px 24px;">

          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 16px auto;"><tr>
          {social_icons}
          </tr></table>

          <p style="text-align:center;margin:0 0 18px 0;">
          <a href="https://aumyaa.com" class="aumyaa-yellow-text" style="color:#f7c600;font-size:11px;margin:0 8px;">About</a>
          <span style="color:#555555;">|</span>
          <a href="https://aumyaa.com/insights" class="aumyaa-yellow-text" style="color:#f7c600;font-size:11px;margin:0 8px;">Case Studies</a>
          <span style="color:#555555;">|</span>
          <a href="https://aumyaa.com/insights" class="aumyaa-yellow-text" style="color:#f7c600;font-size:11px;margin:0 8px;">Knowledge Base</a>
          </p>

          <p class="aumyaa-yellow-text" style="color:#f7c600;text-align:center;letter-spacing:3px;font-size:10px;margin:0 0 18px 0;text-transform:uppercase;">&mdash; &mdash; &mdash; &mdash; &mdash; Get in touch &mdash; &mdash; &mdash; &mdash; &mdash;</p>
          <p class="aumyaa-white-text" style="color:#ffffff;font-size:13px;margin:0 0 3px 0;font-weight:bold;text-align:center;">Aumyaa Consulting Services LLP</p>
          <p style="color:#999999;font-size:11px;margin:0 0 14px 0;line-height:1.5;text-align:center;">
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh &mdash; 201301<br>
          Services: PAN India
          </p>
          <p style="color:#dddddd;font-size:12px;margin:0 0 4px 0;text-align:center;">Yukti Arora &nbsp;&middot;&nbsp; <a href="mailto:yukti.arora@aumyaa.com" class="aumyaa-yellow-text" style="color:#f7c600;">yukti.arora@aumyaa.com</a></p>
          <p style="margin:0 0 4px 0;text-align:center;"><a href="https://www.aumyaa.com" class="aumyaa-yellow-text" style="color:#f7c600;font-size:12px;">www.aumyaa.com</a></p>
          <p style="margin:0 0 16px 0;color:#dddddd;font-size:11px;text-align:center;">Insights &amp; publications: <a href="https://aumyaa.com/insights" class="aumyaa-yellow-text" style="color:#f7c600;">aumyaa.com/insights</a></p>
          <p style="color:#777777;font-size:10px;margin:0 0 18px 0;text-align:center;">Follow us on <a href="https://www.linkedin.com/company/aumyaa" class="aumyaa-yellow-text" style="color:#f7c600;">LinkedIn</a> &amp; <a href="https://www.youtube.com/@aumyaalearningacademy5425" class="aumyaa-yellow-text" style="color:#f7c600;">YouTube</a> for updates on NBFC regulatory compliance.</p>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #333333;"><tr><td style="padding-top:14px;">
          <p class="aumyaa-white-text" style="color:#ffffff;font-size:12px;margin:0;text-align:center;">Warm regards,<br>Team Aumyaa</p>
          <p style="color:#666666;font-size:10px;margin:14px 0 0 0;text-align:center;">You are receiving this because you are on the Aumyaa regulatory alerts list. To stop receiving these, reply to this email with "Unsubscribe".</p>
          </td></tr></table>

          </td></tr>

          </table>
          </td></tr>
          </table>
          </body></html>""")

          gmail_user = os.environ.get("GMAIL_USER", "")
          gmail_pass = os.environ.get("GMAIL_APP_PASSWORD", "")
          raw_emails = os.environ.get("ALERT_EMAIL", "").replace("\n", ",").replace("\r", ",")
          to_email_list = [e.strip() for e in raw_emails.split(",") if e.strip()]

          parts = []
          if notif_items:  parts.append(f"{len(notif_items)} RBI Notification(s)")
          if md_items:     parts.append(f"{len(md_items)} RBI Master Direction(s)")
          if sebi_all:     parts.append(f"{len(sebi_all)} SEBI Update(s)")
          if certin_items: parts.append(f"{len(certin_items)} CERT-In Guideline(s)")
          subject = "Regulatory Alert: " + " + ".join(parts) + " Published"

          msg = MIMEMultipart('alternative')
          msg['From']    = gmail_user
          msg['To']      = ", ".join(to_email_list)
          msg['Subject'] = subject
          msg.attach(MIMEText(plain_body, 'plain'))
          msg.attach(MIMEText(html_body, 'html'))

          print(f"HTML body size: {len(html_body.encode('utf-8'))} bytes")

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email_list, msg.as_string())
              print(f"Email sent to {len(to_email_list)} recipients: {subject}")
          EOF

      # ---------------- Save state (always) ----------------
      - name: Save state and push
        if: always() && (steps.notif.outcome == 'success' || steps.md.outcome == 'success' || steps.sebi.outcome == 'success' || steps.certin.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_notif_sent.json .github/rbi_md_sent.json .github/sebi_sent.json .github/certin_sent.json
          git commit -m "chore: update regulatory monitor sent-set" || echo "Nothing to commit"
          git pull --rebase origin main
          git push

      - name: Upload fetched pages for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages-${{ github.run_id }}
          path: |
            notifications.html
            notifications_rss.xml
            master_directions.html
            certin_guidelines.html
            sebi_*.html
          retention-days: 7
