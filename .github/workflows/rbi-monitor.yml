name: RBI Monitor - Notifications & Master Directions
on:
  schedule:
    - cron: '0 3,12 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch both RBI pages
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o notifications.html \
            "https://www.rbi.org.in/scripts/NotificationUser.aspx"
          echo "Notifications page: $(wc -c < notifications.html) bytes"

          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o master_directions.html \
            "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
          echo "Master Directions page: $(wc -c < master_directions.html) bytes"

      - name: Check Notifications for new entries
        id: check_notif
        run: |
          MAX_ID=$(grep -oP '(?<=NotificationUser\.aspx\?Id=)\d+' notifications.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_notif_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Notifications - Current max: $MAX_ID | Previous: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Master Directions for new entries
        id: check_md
        run: |
          MAX_ID=$(grep -oP '(?<=id=)\d+' master_directions.html | sort -n | tail -1)
          PREV_ID=$(cat .github/rbi_md_last_id.txt 2>/dev/null || echo "0")
          echo "max_id=$MAX_ID" >> $GITHUB_OUTPUT
          echo "prev_id=$PREV_ID" >> $GITHUB_OUTPUT
          echo "Master Directions - Current max: $MAX_ID | Previous: $PREV_ID"
          if [ "$MAX_ID" -gt "$PREV_ID" ]; then
            echo "new_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract new Notifications
        if: steps.check_notif.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json

          with open('notifications.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check_notif.outputs.prev_id }}")

          # Plain HTML pattern - links render directly in this page
          pattern = r'NotificationUser\.aspx\?Id=(\d+)&(?:amp;)?Mode=0[^>]*>([^<]+)</a>'
          matches = re.findall(pattern, content)
          print(f"Total notification matches: {len(matches)}")

          new_items = []
          seen = set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/scripts/NotificationUser.aspx?Id={id_str}&Mode=0'
                  })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_notifications.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"New notifications found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Extract new Master Directions
        if: steps.check_md.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import re, json, base64

          with open('master_directions.html', 'r', encoding='utf-8', errors='ignore') as f:
              content = f.read()

          prev_id = int("${{ steps.check_md.outputs.prev_id }}")

          viewstate_match = re.search(r'__VIEWSTATE[^>]*value="([^"]+)"', content)
          decoded_text = ""
          if viewstate_match:
              try:
                  decoded_text = base64.b64decode(viewstate_match.group(1)).decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"Decode error: {e}")

          pattern = r'href=BS_ViewMasDirections\.aspx\?id=(\d+)>\s*([^<]+)'
          matches = re.findall(pattern, decoded_text)
          print(f"Total master direction matches: {len(matches)}")

          new_items = []
          seen = set()
          for id_str, title in matches:
              title = title.strip()
              if int(id_str) > prev_id and id_str not in seen and len(title) > 10:
                  seen.add(id_str)
                  new_items.append({
                      'id': id_str,
                      'title': title,
                      'url': f'https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id={id_str}'
                  })

          new_items.sort(key=lambda x: int(x['id']), reverse=True)

          with open('new_master_directions.json', 'w') as f:
              json.dump(new_items, f, indent=2)

          print(f"New master directions found: {len(new_items)}")
          for item in new_items:
              print(f"  [{item['id']}] {item['title']}")
          EOF

      - name: Send email alert
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true'
        run: |
          python3 - <<'EOF'
          import json, smtplib, textwrap
          from datetime import date
          from email.mime.text import MIMEText
          from email.mime.image import MIMEImage
          from email.mime.multipart import MIMEMultipart

          notif_items = []
          md_items = []

          try:
              with open('new_notifications.json') as f:
                  notif_items = json.load(f)
          except FileNotFoundError:
              pass

          try:
              with open('new_master_directions.json') as f:
                  md_items = json.load(f)
          except FileNotFoundError:
              pass

          total = len(notif_items) + len(md_items)
          today = date.today().strftime('%d-%b-%Y')

          # ---- plain text fallback ----
          sections_plain = []
          if notif_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in notif_items]
              sections_plain.append(f"NOTIFICATIONS ({len(notif_items)} new)\n" + "\n\n".join(lines))
          if md_items:
              lines = [f"- {i['title']}\n  {i['url']}" for i in md_items]
              sections_plain.append(f"MASTER DIRECTIONS ({len(md_items)} new)\n" + "\n\n".join(lines))

          plain_body = textwrap.dedent(f"""\
          Hi team, Please find the RBI recent update

          RBI has published {total} new item(s).

          {chr(10).join(sections_plain)}

          ------------------------------
          GET IN TOUCH
          ------------------------------
          Aumyaa Consulting Services LLP | Head Quarter: Noida
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh - 201301
          Services: PAN India

          Yukti Arora: 9818248133  yukti.arora@aumyaa.com
          Ayushi Aggarwal: 9582604587  ayushi.aggarwal@aumyaa.com
          www.aumyaa.com

          Follow us on LinkedIn & YouTube for updates on NBFC regulatory compliance.

          Warm regards,
          Team Aumyaa
          """)

          # ---- html: card-style list instead of a rigid table (avoids Gmail's repeated-row clipping) ----
          def card(item, tag):
              return textwrap.dedent(f"""\
              <div style="padding:14px 18px;border-left:3px solid #f7c600;background:#fafafa;margin-bottom:10px;border-radius:0 6px 6px 0;">
              <span style="display:inline-block;background:#111111;color:#f7c600;font-size:11px;font-weight:bold;letter-spacing:.5px;padding:2px 8px;border-radius:10px;margin-bottom:6px;">{tag}</span>
              <div style="margin-top:6px;"><a href="{item['url']}" style="color:#111111;font-size:14px;font-weight:600;text-decoration:none;line-height:1.4;">{item['title']}</a></div>
              </div>""")

          cards = ""
          if notif_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">Notifications</p>'
              cards += "".join(card(i, "NOTIFICATION") for i in notif_items)
          if md_items:
              cards += '<p style="color:#111111;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px 0;">Master Directions</p>'
              cards += "".join(card(i, "MASTER DIRECTION") for i in md_items)

          html_body = textwrap.dedent(f"""\
          <html><body style="margin:0;padding:0;background:#eeeeee;font-family:Arial,Helvetica,sans-serif;">
          <div style="max-width:640px;margin:20px auto;background:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
          <div style="background:#111111;padding:28px 24px 22px 24px;text-align:center;">
          <img src="cid:aumyaa_logo" alt="Aumyaa" style="height:44px;margin-bottom:14px;">
          <h1 style="color:#ffffff;margin:0;font-size:20px;font-weight:700;">Regulatory Updates</h1>
          <p style="color:#f7c600;margin:4px 0 0 0;font-size:12px;">{today}</p>
          </div>
          <div style="height:3px;background:#f7c600;"></div>
          <div style="padding:24px 24px 8px 24px;">
          <p style="color:#111111;font-size:15px;margin:0 0 2px 0;">Hi team,</p>
          <p style="color:#555555;font-size:14px;margin:0 0 4px 0;">Please find the RBI recent update — <b style="color:#111111;">{total} new item(s)</b> published.</p>
          {cards}
          </div>
          <div style="background:#111111;padding:26px 24px;margin-top:10px;">
          <p style="color:#f7c600;text-align:center;letter-spacing:3px;font-size:10px;margin:0 0 18px 0;text-transform:uppercase;">— — — — — Get in touch — — — — —</p>
          <p style="color:#ffffff;font-size:13px;margin:0 0 3px 0;font-weight:bold;">Aumyaa Consulting Services LLP</p>
          <p style="color:#999999;font-size:11px;margin:0 0 14px 0;line-height:1.5;">
          2414, 4th Floor, Express Trade Tower 2 B36, Sector 132, Noida, Uttar Pradesh — 201301<br>
          Services: PAN India
          </p>
          <p style="color:#dddddd;font-size:12px;margin:0 0 4px 0;">Yukti Arora: 9818248133 &nbsp;·&nbsp; <a href="mailto:yukti.arora@aumyaa.com" style="color:#f7c600;text-decoration:none;">yukti.arora@aumyaa.com</a></p>
          <p style="color:#dddddd;font-size:12px;margin:0 0 14px 0;">Ayushi Aggarwal: 9582604587 &nbsp;·&nbsp; <a href="mailto:ayushi.aggarwal@aumyaa.com" style="color:#f7c600;text-decoration:none;">ayushi.aggarwal@aumyaa.com</a></p>
          <p style="margin:0 0 12px 0;"><a href="https://www.aumyaa.com" style="color:#f7c600;font-size:12px;text-decoration:none;">www.aumyaa.com</a></p>
          <p style="color:#777777;font-size:10px;margin:0 0 16px 0;">Follow us on LinkedIn &amp; YouTube for updates on NBFC regulatory compliance.</p>
          <p style="color:#ffffff;font-size:12px;margin:0;">Warm regards,<br>Team Aumyaa</p>
          </div>
          </div>
          </body></html>""")

          gmail_user = "${{ secrets.GMAIL_USER }}"
          gmail_pass = "${{ secrets.GMAIL_APP_PASSWORD }}"
          to_email_list = [e.strip() for e in "${{ secrets.ALERT_EMAIL }}".split(",")]

          parts = []
          if notif_items: parts.append(f"{len(notif_items)} Notification(s)")
          if md_items:    parts.append(f"{len(md_items)} Master Direction(s)")
          subject = "RBI Alert: " + " + ".join(parts) + " Published"

          msg = MIMEMultipart('related')
          msg['From']    = gmail_user
          msg['To']      = ", ".join(to_email_list)
          msg['Subject'] = subject

          alt = MIMEMultipart('alternative')
          alt.attach(MIMEText(plain_body, 'plain'))
          alt.attach(MIMEText(html_body, 'html'))
          msg.attach(alt)

          logo_path = "assets/aumyaa-logo.jpeg"
          try:
              with open(logo_path, 'rb') as f:
                  logo = MIMEImage(f.read())
                  logo.add_header('Content-ID', '<aumyaa_logo>')
                  logo.add_header('Content-Disposition', 'inline', filename='aumyaa-logo.jpeg')
                  msg.attach(logo)
          except FileNotFoundError:
              print(f"WARNING: logo not found at {logo_path} - email will send without it")

          print(f"HTML body size: {len(html_body.encode('utf-8'))} bytes")

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail_user, gmail_pass)
              server.sendmail(gmail_user, to_email_list, msg.as_string())
              print(f"Email sent to {len(to_email_list)} recipients: {subject}")
          EOF


      - name: Save new IDs and push
        if: steps.check_notif.outputs.new_found == 'true' || steps.check_md.outputs.new_found == 'true'
        run: |
          if [ "${{ steps.check_notif.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_notif.outputs.max_id }}" > .github/rbi_notif_last_id.txt
          fi
          if [ "${{ steps.check_md.outputs.new_found }}" == "true" ]; then
            echo "${{ steps.check_md.outputs.max_id }}" > .github/rbi_md_last_id.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/rbi_notif_last_id.txt .github/rbi_md_last_id.txt
          git commit -m "chore: update RBI last seen IDs (notif=${{ steps.check_notif.outputs.max_id }}, md=${{ steps.check_md.outputs.max_id }})"
          git push
